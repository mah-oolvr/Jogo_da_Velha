
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="css/mystyle.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg fixed-top bg-cor-que-eu-quero">
            <section class="container py-1">

                <a class="navbar-brand text-white" href="index.html">
                    <span>Jogo da Velha</span>
                </a>

                <button type="button" class="navbar-toggler"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbar-items">
                    <i class="bi bi-list"></i>
                </button>

                <section class="collapse navbar-collapse" id="navbar-items">
                    <ul class="navbar-nav me-auto mb-0">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="historia.html">História</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="sobre.html">Sobre</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="dicas.html">Dicas</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="contato.html">Contato</a>
                        </li>

                    </ul>
                </section>

            </section>
        </nav>
    </header>

    <main class="principal">

        <section class="container" id="container-top">

            <section class="row g-4">

                <!-- Jogo da velha -->
                <section class="col-12 col-md-6">

                    <h4 class="text-center primary-color">Jogo da Velha</h4>

                    <section class="tabuleiro">
                        <section class="celula" data-celula></section>
                        <section class="celula" data-celula></section>
                        <section class="celula" data-celula></section>
                        <section class="celula" data-celula></section>
                        <section class="celula" data-celula></section>
                        <section class="celula" data-celula></section>
                        <section class="celula" data-celula></section>
                        <section class="celula" data-celula></section>
                        <section class="celula" data-celula></section>
                    </section>

                    <section class="status text-center mt-3">
                        <p>É a vez do jogador X</p>
                    </section>

                    <section class="text-center mt-2">
                        <button class="btn btn-primary" id="reset-button">
                            Reiniciar jogo
                        </button>
                    </section>

                </section>

                <!-- Slide de imagens -->
                <section class="col-12 col-md-6">

                    <h4 class="text-center primary-color">Galeria</h4>

                    <section class="carousel slide" id="slider"
                        data-bs-ride="carousel" data-bs-interval="3000">

                        <section class="carousel-indicators">
                            <button type="button" class="active"
                                data-bs-target="#slider" data-bs-slide-to="0"></button>

                            <button type="button"
                                data-bs-target="#slider" data-bs-slide-to="1"></button>

                            <button type="button"
                                data-bs-target="#slider" data-bs-slide-to="2"></button>
                        </section>

                        <section class="carousel-inner">

                            <section class="carousel-item active">
                                <img class="d-block w-100"
                                    src="images/brinde-Medalha-Milagrosa-1.png" alt="Jogo da velha">
                            </section>

                            <section class="carousel-item">
                                <img class="d-block w-100"
                                    src="images/SantaTerezinha.png" alt="Tabuleiro">
                            </section>

                            <section class="carousel-item">
                                <img class="d-block w-100"
                                    src="images/igrejas-autonomas-catequistasbrasil-1.jpg" alt="Jogo">
                            </section>

                        </section>

                        <button class="carousel-control-prev"
                            type="button" data-bs-target="#slider"
                            data-bs-slide="prev">
                            <span class="carousel-control-prev-icon"></span>
                        </button>

                        <button class="carousel-control-next"
                            type="button" data-bs-target="#slider"
                            data-bs-slide="next">
                            <span class="carousel-control-next-icon"></span>
                        </button>

                    </section>

                </section>

            </section>

        </section>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript do projeto -->
    <script src="js/myscript.js"></script>

</body>
</html>
